# Production-style local stack. Copy .env.example → .env first.
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      OTP_ECHO: "false"
      DEMO_MODE: ${DEMO_MODE:-false}
      DATA_FILE: /data/f360_data.json
    volumes:
      - familia-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  familia-data:
