<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GPS FAMILIA</title>
  <meta name="theme-color" content="#0b0d0e" />
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*, display-capture=*" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GPS FAMILIA" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" as="image" href="splash_last_supper_mobsters.png" fetchpriority="high" />
  <link rel="modulepreload" href="app.js?v=2172" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script type="importmap">
  {
    "imports": {
      "qrcode": "https://esm.sh/qrcode@1.5.3",
      "livekit-client": "https://esm.sh/livekit-client@2.15.7"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#map" data-i18n="a11y.skip">Skip to map</a>
  <div id="app">
    <div class="map-panel">
      <div id="map" role="application" aria-label="Family map" tabindex="-1"></div>
    </div>

    <div id="layer-control" class="layer-control" role="toolbar" aria-label="Map layer">
      <button class="layer-btn active" data-layer="street" title="Street map" type="button" data-i18n-title="map.street" aria-label="Street map">🗺️</button>
      <button class="layer-btn" data-layer="satellite" title="Satellite" type="button" data-i18n-title="map.satellite" aria-label="Satellite">🛰️</button>
      <button class="layer-btn" data-layer="terrain" title="Terrain" type="button" data-i18n-title="map.terrain" aria-label="Terrain">⛰️</button>
    </div>

    <div id="map-tools" class="map-tools" role="toolbar" aria-label="Map zoom and refresh">
      <button id="btn-zoom-in" type="button" title="Zoom in" data-i18n-title="map.zoomIn" aria-label="Zoom in">+</button>
      <button id="btn-zoom-out" type="button" title="Zoom out" data-i18n-title="map.zoomOut" aria-label="Zoom out">−</button>
      <button id="btn-map-refresh" type="button" title="Refresh family pins" data-i18n-title="map.refresh" aria-label="Refresh family pins">↻</button>
      <button id="btn-map-me" type="button" title="Center on me" data-i18n-title="map.me" aria-label="Center on me">◎</button>
      <button id="btn-map-trail" type="button" title="Map or hide my trail" data-i18n-title="map.trail" aria-label="Map or hide my trail">〰</button>
    </div>

    <div id="pin-sheet" class="pin-sheet" hidden></div>

    <header class="topbar" role="banner">
      <div class="left">
        <button id="btn-account" class="brand-hit" type="button" title="Open menu" aria-label="Open GPS FAMILIA menu" data-i18n-aria="nav.menu" aria-expanded="false" aria-controls="account-drawer">
          <span class="ham" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-word" data-i18n="app.name">GPS FAMILIA</span>
        </button>
      </div>
      <div class="right" id="top-actions" role="toolbar" aria-label="Quick actions">
        <button id="btn-toggle-tracking" class="tb-btn track-chip" type="button" title="Share your location" aria-pressed="false">Track Off</button>
        <button id="btn-sos" class="tb-btn sos-btn" type="button" title="Send SOS to all families" data-i18n="nav.sos">SOS</button>
        <button id="btn-community" class="tb-btn" type="button" title="Community feed" data-i18n-title="nav.feed"><span class="tb-ico" aria-hidden="true">◈</span><span class="tb-label" data-i18n="nav.feed">Feed</span></button>
        <button id="btn-market" class="tb-btn" type="button" title="Marketplace" aria-label="Marketplace"><span class="tb-ico" aria-hidden="true">🏷</span><span class="tb-label">Market</span></button>
        <button id="btn-search" class="tb-btn" type="button" title="Find people" data-i18n-title="nav.search" aria-label="Find people">🔍</button>
        <button id="btn-inbox" class="tb-btn" type="button" title="Inbox" data-i18n-title="nav.inbox" aria-label="Inbox">
          ✉️
          <span id="inbox-badge" aria-live="polite">0</span>
        </button>
        <button id="btn-family" class="tb-btn" type="button" title="Family members" data-i18n-title="nav.family" aria-label="Family members">👥</button>
        <button id="btn-help" class="tb-btn" type="button" title="Help" data-i18n-title="nav.help" aria-label="Help">?</button>
      </div>
    </header>

    <input id="profile-input" type="file" accept="image/*" capture="environment" hidden />

    <footer class="footer" role="contentinfo">
      <div id="status">Not signed in</div>
      <div id="live-pill" class="live-pill" title="Realtime connection" aria-live="polite">offline</div>
    </footer>

    <nav id="app-dock" class="app-dock" aria-label="Main">
      <button type="button" class="dock-btn on" data-dock="map" aria-label="Map"><span class="dock-ico" aria-hidden="true">🗺</span><span class="dock-lbl">Map</span></button>
      <button type="button" class="dock-btn" data-dock="inbox" aria-label="Inbox"><span class="dock-ico" aria-hidden="true">✉️</span><span class="dock-lbl">Inbox</span></button>
      <button type="button" class="dock-btn" data-dock="feed" aria-label="Feed"><span class="dock-ico" aria-hidden="true">◈</span><span class="dock-lbl">Feed</span></button>
      <button type="button" class="dock-btn" data-dock="market" aria-label="Market"><span class="dock-ico" aria-hidden="true">🏷</span><span class="dock-lbl">Market</span></button>
      <button type="button" class="dock-btn" data-dock="menu" aria-label="Menu"><span class="dock-ico" aria-hidden="true">☰</span><span class="dock-lbl">Menu</span></button>
    </nav>

    <div id="drawer-scrim" class="drawer-scrim" aria-hidden="true"></div>
    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-header">
        <span class="drawer-title">Family Members</span>
        <button id="drawer-close" class="modal-close" title="Close" type="button">✕</button>
      </div>
      <div class="drawer-search">
        <input id="drawer-find" class="input" type="search" placeholder="Find by name or phone…" autocomplete="off" />
      </div>
      <div id="member-list" class="member-list"></div>
      <div class="drawer-footer">
        <button id="btn-create-family-drawer" class="btn small" type="button">＋ Create / Join Family</button>
      </div>
    </aside>

    <div id="account-scrim" class="drawer-scrim" aria-hidden="true"></div>
    <aside id="account-drawer" class="account-drawer" aria-hidden="true" role="navigation" aria-label="Account menu">
      <button id="account-close" class="modal-close" title="Close menu" type="button">✕</button>
      <div class="acct-head">
        <button id="acct-avatar-btn" class="acct-avatar-btn" type="button" title="Change photo">
          <img id="acct-avatar" alt="" />
          <span class="acct-avatar-edit">✎</span>
        </button>
        <div id="acct-name" class="acct-name">Not signed in</div>
        <div id="acct-email" class="acct-meta"></div>
        <div id="acct-phone" class="acct-meta"></div>
      </div>
      <nav id="acct-nav" class="acct-nav"></nav>
    </aside>

    <aside id="feed-panel" class="feed-panel" aria-hidden="true">
      <div id="feed-root" class="feed-app"></div>
    </aside>
    <aside id="market-panel" class="feed-panel market-panel" aria-hidden="true">
      <div id="market-root" class="feed-app"></div>
    </aside>
  </div>

  <div id="splash-overlay" aria-hidden="false">
    <img id="splash-art" src="splash_last_supper_mobsters.png" alt="" fetchpriority="high" decoding="async" />
    <div id="splash-vignette"></div>
    <div id="splash-content">
      <h1 id="splash-title" class="gf-title" aria-label="GPS FAMILIA">
        <span class="gf-l gf-gps" style="--s:32px">G</span>
        <span class="gf-l gf-gps" style="--s:20px">P</span>
        <span class="gf-l gf-gps" style="--s:38px">S</span>
        <span class="gf-gap" aria-hidden="true"></span>
        <span class="gf-l" style="--s:18px">F</span>
        <span class="gf-l" style="--s:34px">A</span>
        <span class="gf-l" style="--s:24px">M</span>
        <span class="gf-l" style="--s:40px">I</span>
        <span class="gf-l" style="--s:20px">L</span>
        <span class="gf-l" style="--s:30px">I</span>
        <span class="gf-l" style="--s:22px">A</span>
      </h1>
      <div id="splash-sub" data-i18n="app.tagline">Family. Loyalty. Location.</div>
      <button id="splash-continue" class="splash-enter" type="button" data-i18n="splash.enter">Enter</button>
    </div>
    <div id="splash-copy">© 2026 Deserius Arte · Hustler Anomalies Enterprises</div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById("splash-overlay");
      var btn = document.getElementById("splash-continue");
      function hideSplash() {
        if (!overlay) return;
        overlay.classList.add("hidden");
        overlay.setAttribute("aria-hidden", "true");
        overlay.style.display = "none";
        overlay.style.pointerEvents = "none";
        overlay.style.zIndex = "0";
      }
      window.__hideSplash = hideSplash;
      function primeMedia() {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: true }).then(function (stream) {
              (stream.getTracks() || []).forEach(function (tr) { try { tr.stop(); } catch (e) {} });
            }).catch(function () {});
          }
        } catch (e) {}
        try {
          if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function () {}, function () {}, { timeout: 8000, maximumAge: 60000 });
        } catch (e) {}
      }
      if (btn) btn.addEventListener("click", function () { primeMedia(); hideSplash(); });
    })();
  </script>
  <script type="module" src="app.js?v=2172"></script>
</body>
</html>
