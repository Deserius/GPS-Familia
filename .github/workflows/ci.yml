name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Full-stack tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DEMO_MODE: "true"
          OTP_ECHO: "true"

  sast:
    name: Static secret & pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/sast.test.js
